<!doctype html><meta charset="utf-8"><title>闪烁检测取景页</title>
<style>html,body{margin:0;overflow:hidden;background:#000}</style>
<script type="module">
// 闪烁（z-fighting / 剖切面共面 / 透明排序跳变）检测用的离屏取景页。
// 与 main.js 同一套光照、雾、地面与剖面，但相机、剖面、日照由外部脚本指定；
// 渲染进 RenderTarget 后把像素读回来，用几种"微扰"对比找出不稳定的像素。
import * as THREE from '../lib/three.module.js';
import { buildCathedral } from '../src/cathedral.js';

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.localClippingEnabled = true;                 // 剖面靠 material.clippingPlanes
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#cbd6e6');
scene.fog = new THREE.FogExp2('#d8d4c6', 0.0016);
const hemi = new THREE.HemisphereLight('#cfe0f5', '#6d6a5b', 0.85);
const sun = new THREE.DirectionalLight('#fff1da', 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -110; sun.shadow.camera.right = 110;
sun.shadow.camera.top = 120; sun.shadow.camera.bottom = -70;
sun.shadow.camera.near = 20; sun.shadow.camera.far = 350; sun.shadow.bias = -0.0006;
scene.add(hemi, sun, sun.target);
for (const [x, y, z] of [[0, 13, 22], [0, 13, -14], [0, 10, 42]]) {
  const p = new THREE.PointLight('#ffd9a0', 220, 70, 2); p.position.set(x, y, z); scene.add(p);
}
const ground = new THREE.Mesh(new THREE.CircleGeometry(600, 48),
  new THREE.MeshStandardMaterial({ color: '#89906f' }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.25; ground.receiveShadow = true;
ground.userData.tag = '大地';
const plaza = new THREE.Mesh(new THREE.PlaneGeometry(110, 190),
  new THREE.MeshStandardMaterial({ color: '#9b968b' }));
plaza.rotation.x = -Math.PI / 2; plaza.position.set(0, -0.08, 20); plaza.receiveShadow = true;
plaza.userData.tag = '广场';
scene.add(ground, plaza);

const { root } = buildCathedral();
scene.add(root);
scene.updateMatrixWorld(true);
const mats = new Set();
root.traverse((o) => { if (o.isMesh) for (const m of (Array.isArray(o.material) ? o.material : [o.material])) mats.add(m); });

// 与 main.js 完全一致的三档剖面
const CUT_EPS = 0.05;                                  // 与 main.js 保持一致
const SECTIONS = [
  { name: '完整外观', planes: [] },
  { name: '横剖面', planes: [new THREE.Plane(new THREE.Vector3(0, 0, -1), 27 + CUT_EPS)] },
  { name: '纵剖面', planes: [new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0 + CUT_EPS)] },
];
let active = [];
function applySection(planes) {
  active = planes;
  for (const m of mats) { m.clippingPlanes = planes.length ? planes : null; m.needsUpdate = true; }
}
function setSun(t) {                                   // 与 main.js 的日照曲线一致
  const s = Math.sin(Math.PI * t), az = Math.PI * t, el = (7 + 56 * s) * Math.PI / 180, R = 170;
  sun.position.set(R * Math.cos(el) * Math.sin(az), R * Math.sin(el), -R * Math.cos(el) * Math.cos(az));
  sun.intensity = 1.0 + 1.5 * s; hemi.intensity = 0.3 + 0.6 * s;
}

let W = 640, H = 400, rt = null, cam = null;
function frame(mod = {}) {                             // 渲染一帧并读回像素
  const savedPos = cam.position.clone(), savedNear = cam.near;
  const savedC = active.map((p) => p.constant);
  if (mod.dPos) cam.position.add(mod.dPos);
  if (mod.near) cam.near = savedNear * mod.near;
  if (mod.dClip) for (const p of active) p.constant += mod.dClip;
  cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);
  renderer.setRenderTarget(rt);
  renderer.render(scene, cam);
  const buf = new Uint8Array(W * H * 4);
  renderer.readRenderTargetPixels(rt, 0, 0, W, H, buf);
  renderer.setRenderTarget(null);
  cam.position.copy(savedPos); cam.near = savedNear;
  active.forEach((p, i) => { p.constant = savedC[i]; });
  cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);
  return buf;
}
function describe(o) {
  const box = new THREE.Box3().setFromObject(o);
  const m = Array.isArray(o.material) ? o.material[0] : o.material;
  return {
    tag: o.userData.tag || o.name || '', geo: o.geometry.type,
    col: m?.color?.getHexString?.() ?? '', transparent: !!m?.transparent,
    depthWrite: m?.depthWrite !== false,
    min: box.min.toArray().map((v) => +v.toFixed(2)), max: box.max.toArray().map((v) => +v.toFixed(2)),
  };
}
const rc = new THREE.Raycaster();
function probe(px, py) {           // 从某像素打射线，报出前几个（未被剖掉的）命中；py 自下而上，与读回的像素一致
  rc.setFromCamera(new THREE.Vector2(px / W * 2 - 1, py / H * 2 - 1), cam);
  const hits = rc.intersectObject(scene, true).filter((h) =>
    active.every((pl) => pl.distanceToPoint(h.point) >= 0));
  return hits.slice(0, 4).map((h) => ({
    d: +h.distance.toFixed(3), p: h.point.toArray().map((v) => +v.toFixed(2)), ...describe(h.object),
  }));
}

// ---------- 主入口 ----------
window.__scan = (cfg) => {
  W = cfg.w; H = cfg.h;
  if (rt) rt.dispose();
  rt = new THREE.WebGLRenderTarget(W, H, { samples: 0 });
  renderer.setSize(W, H);
  cam = new THREE.PerspectiveCamera(55, W / H, 0.5, 2000);
  cam.position.set(...cfg.pos); cam.lookAt(...cfg.tgt);
  applySection(SECTIONS[cfg.section].planes);
  setSun(cfg.sunT ?? 0.42);
  cam.updateMatrixWorld(true);

  const right = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0);
  const base = frame();
  // 三种微扰，各自对应一种成因：
  //   near  —— 只改深度量化，屏幕上什么都不动 → 变了就是 z-fighting
  //   clip  —— 只挪剖切面 3 mm → 变了就是面正好躺在剖切面上，逐像素抖动
  //   pos   —— 相机挪 1 mm（亚像素）→ 抓上面两种之外的不稳定（透明体排序跳变等）
  const passes = [
    { key: 'z', label: 'z-fighting（深度打架）', buf: frame({ near: 1.0002 }) },
    ...(active.length ? [{ key: 'c', label: '面躺在剖切面上（裁剪抖动）', buf: frame({ dClip: 0.004 }) }] : []),
    { key: 'p', label: '视点微动不稳定', buf: frame({ dPos: right.clone().multiplyScalar(0.001) }) },
  ];
  const TH = cfg.threshold ?? 16;
  const flag = new Uint8Array(W * H);                  // 位掩码：哪一路微扰把它翻了
  const kind = ['z', 'c', 'p'];
  let n = 0;
  for (const [pi, pass] of passes.entries()) {
    for (let i = 0; i < W * H; i++) {
      const o = i * 4;
      const d = Math.max(Math.abs(base[o] - pass.buf[o]), Math.abs(base[o + 1] - pass.buf[o + 1]),
        Math.abs(base[o + 2] - pass.buf[o + 2]));
      if (d > TH) flag[i] |= 1 << kind.indexOf(pass.key);
    }
  }
  for (let i = 0; i < W * H; i++) if (flag[i]) n++;

  // 聚类：按 12×12 的格子归并，再把相邻格子连通（散点式的抖动靠格子聚得起来）
  const CS = 12, GW = Math.ceil(W / CS), GH = Math.ceil(H / CS);
  const cell = new Map();
  for (let i = 0; i < W * H; i++) {
    if (!flag[i]) continue;
    const x = i % W, y = (i / W) | 0;
    const k = ((y / CS) | 0) * GW + ((x / CS) | 0);
    const c = cell.get(k) || { n: 0, sx: 0, sy: 0, mask: 0, px: [] };
    c.n++; c.sx += x; c.sy += y; c.mask |= flag[i];
    if (c.px.length < 40) c.px.push(i);
    cell.set(k, c);
  }
  for (const [k, c] of cell) if (c.n < 4) cell.delete(k);   // 零星的边缘像素不算
  const seen = new Set(), clusters = [];
  for (const k0 of cell.keys()) {
    if (seen.has(k0)) continue;
    const stack = [k0]; seen.add(k0);
    const acc = { n: 0, sx: 0, sy: 0, mask: 0, px: [] };
    while (stack.length) {
      const k = stack.pop(), c = cell.get(k);
      acc.n += c.n; acc.sx += c.sx; acc.sy += c.sy; acc.mask |= c.mask; acc.px.push(...c.px);
      const gx = k % GW, gy = (k / GW) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = gx + dx, ny = gy + dy;
        if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
        const nk = ny * GW + nx;
        if (cell.has(nk) && !seen.has(nk)) { seen.add(nk); stack.push(nk); }
      }
    }
    clusters.push(acc);
  }
  clusters.sort((a, b) => b.n - a.n);

  const out = clusters.slice(0, cfg.top ?? 12).map((c) => {
    const cx = c.sx / c.n, cy = c.sy / c.n;
    let best = c.px[0], bd = Infinity;                 // 取离质心最近的一个抖动像素去打射线
    for (const i of c.px) {
      const d = (i % W - cx) ** 2 + (((i / W) | 0) - cy) ** 2;
      if (d < bd) { bd = d; best = i; }
    }
    const px = best % W, py = (best / W) | 0;
    return {
      pixels: c.n, at: [px, H - 1 - py], center: [Math.round(cx), H - 1 - Math.round(cy)],
      causes: kind.filter((_, i) => c.mask & (1 << i)),
      hits: probe(px + 0.5, py + 0.5),
    };
  });

  // 标注图：底图 + 抖动像素涂红
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W, H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const s = ((H - 1 - y) * W + x) * 4, d = (y * W + x) * 4;   // RT 是上下翻的
    const f = flag[(H - 1 - y) * W + x];
    img.data[d] = f ? 255 : base[s];
    img.data[d + 1] = f ? 0 : base[s + 1];
    img.data[d + 2] = f ? 0 : base[s + 2];
    img.data[d + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return { flagged: n, total: W * H, clusters: out, png: cv.toDataURL('image/png') };
};
// 单点查询：某个像素上究竟压着哪几块网格（配合 --probe=x,y 用）
window.__probe = (cfg, px, py) => {
  window.__scan({ ...cfg, top: 0 });
  return probe(px + 0.5, H - 1 - py + 0.5);
};
window.__ready = true;
</script>
