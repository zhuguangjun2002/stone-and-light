<!doctype html><meta charset="utf-8"><title>取景截图</title>
<style>html,body{margin:0;overflow:hidden;background:#000}</style>
<script type="module">
// 无头截图用的取景页：与 main.js 同一套光照/地面，但相机由外部脚本指定。
import * as THREE from '../lib/three.module.js';
import { buildCathedral } from '../src/cathedral.js';
import { canvasTexture, mulberry32 } from '../src/materials.js';
import { P, sunPos } from '../src/params.js';
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(1280, 720); r.setPixelRatio(1); r.shadowMap.enabled = true;
r.shadowMap.type = THREE.PCFSoftShadowMap; r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#cbd6e6');
const hemi = new THREE.HemisphereLight('#cfe0f5', '#6d6a5b', 0.85); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff1da', 2.4); sun.castShadow = true;
// 阴影视锥与 main.js 同一份（params.js 的 P.shadow）——这页是无头截图页，必须和主场景
// 看到同一套影子，否则"截图核对"会核对到另一套光上。校验：node tools/check-shadow.mjs
{
  const S = P.shadow;
  sun.shadow.mapSize.set(S.map, S.map);
  sun.shadow.camera.left = -S.H; sun.shadow.camera.right = S.H;
  sun.shadow.camera.top = S.top; sun.shadow.camera.bottom = S.bottom;
  sun.shadow.camera.near = S.near; sun.shadow.camera.far = S.far;
  sun.shadow.bias = S.bias;
}
scene.add(sun, sun.target);
for (const [x, y, z] of [[0, 13, 22], [0, 13, -14], [0, 10, 42]]) {
  const p = new THREE.PointLight('#ffd9a0', 220, 70, 2); p.position.set(x, y, z); scene.add(p);
}
const ground = new THREE.Mesh(new THREE.CircleGeometry(600, 48),
  new THREE.MeshStandardMaterial({ color: '#89906f' }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.2; ground.receiveShadow = true;
const plaza = new THREE.Mesh(new THREE.PlaneGeometry(148, 210),
  new THREE.MeshStandardMaterial({ color: '#9b968b' }));
plaza.rotation.x = -Math.PI / 2; plaza.position.set(6, 0, 10); plaza.receiveShadow = true;
scene.add(ground, plaza);
const soilTex = canvasTexture(512, 512, (ctx, w, h) => {
  const rnd = mulberry32(7);
  ctx.fillStyle = '#5d4a33'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 4200; i++) {
    const v = rnd();
    ctx.fillStyle = v < 0.5
      ? `rgba(28,20,12,${0.10 + rnd() * 0.25})`
      : `rgba(122,100,72,${0.05 + rnd() * 0.18})`;
    ctx.beginPath(); ctx.arc(rnd() * w, rnd() * h, 1 + rnd() * 5, 0, Math.PI * 2); ctx.fill();
  }
  for (let i = 0; i < 26; i++) {
    ctx.strokeStyle = `rgba(18,12,7,${0.06 + rnd() * 0.12})`;
    ctx.lineWidth = 1 + rnd() * 3;
    const y = rnd() * h;
    ctx.beginPath(); ctx.moveTo(0, y);
    ctx.bezierCurveTo(w * 0.3, y + (rnd() - 0.5) * 46, w * 0.7, y + (rnd() - 0.5) * 46, w, y);
    ctx.stroke();
  }
});
if (soilTex) soilTex.repeat.set(150, 150);
const soil = new THREE.Mesh(new THREE.CircleGeometry(600, 48),
  new THREE.MeshBasicMaterial({ color: '#ffffff', map: soilTex }));
soil.rotation.x = Math.PI / 2; soil.position.y = -2.5;
scene.add(soil);

function addFoundations(root) {
  const mat = new THREE.MeshBasicMaterial({ color: '#7d7160' });
  const group = new THREE.Group();
  const box = new THREE.Box3();
  const FT = -0.02, FB = -3.0;
  let i = 0;
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!o.isMesh || o.userData.noFoundation) return;
    const m = Array.isArray(o.material) ? o.material[0] : o.material;
    if (!m || m.transparent || m.depthWrite === false || m.userData?.glazing) return;
    box.setFromObject(o);
    if (box.min.y > 0.08 || box.max.y < 1.2 || box.max.y > 50) return;
    const w = (box.max.x - box.min.x) * 0.96, d = (box.max.z - box.min.z) * 0.96;
    if (w < 0.4 || d < 0.4) return;
    const j = (i++ % 9) * 0.02;
    const top = FT - j, bot = FB - j;
    const f = new THREE.Mesh(new THREE.BoxGeometry(w, top - bot, d), mat);
    f.position.set((box.min.x + box.max.x) / 2, (top + bot) / 2, (box.min.z + box.max.z) / 2);
    group.add(f);
  });
  return group;
}

const builtRoot = buildCathedral().root;
scene.add(builtRoot);
scene.add(addFoundations(builtRoot));
const cam = new THREE.PerspectiveCamera(55, 1280 / 720, 0.5, 2000);
window.__sunAt = (t) => {                       // 轨迹在 params.js，与 main.js / check-shadow 同一份
  const s = Math.sin(Math.PI * t);
  sunPos(t, sun.position);
  sun.intensity = 1.0 + 1.5 * s; hemi.intensity = 0.3 + 0.6 * s;
};
window.__shot = (px, py, pz, tx, ty, tz) => { cam.position.set(px, py, pz); cam.lookAt(tx, ty, tz); r.render(scene, cam); };
window.__sunAt(0.55);
window.__ready = true;
</script>
